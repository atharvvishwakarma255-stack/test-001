openapi: 3.0.3
info:
  title: test-001 API
  version: 1.0.0
paths:
  /test:
    get:
      operationId: testRoute
      summary: Test route
      responses:
        "200":
          description: OK
          content:
            application/json:
              example:
                success: true
                message: Test route is working
                version: 2
                environment: staging
      x-generated-from: routes/misc.routes.js:5
  /health:
    get:
      operationId: healthCheck
      summary: Health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              example:
                status: ok
      x-generated-from: routes/misc.routes.js:6
  /users:
    get:
      operationId: listUsers
      summary: List users
      responses:
        "200":
          description: OK
          content:
            application/json:
              example:
                users: []
  /users/{id}:
    get:
      operationId: getUser
      summary: Get a user by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              example:
                id: "1"
                name: Aniket
        "404":
          description: Not found
  /api/v1/auth/register:
    post:
      operationId: post__api_v1_auth_register
      summary: POST /api/v1/auth/register
      x-generated-from: routes/auth.routes.js:5
      x-feature-owner: atharvvishwakarma255-stack
      responses:
        "200":
          description: OK
        "400":
          description: password must be at least 8 characters
        "409":
          description: An account with this email already exists
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string
              required:
                - name
                - email
                - password
  /api/v1/auth/login:
    post:
      operationId: post__api_v1_auth_login
      summary: POST /api/v1/auth/login
      x-generated-from: routes/auth.routes.js:6
      x-feature-owner: atharvvishwakarma255-stack
      responses:
        "200":
          description: OK
        "400":
          description: email and password are required
        "401":
          description: Invalid email or password
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
                - email
                - password
  /api/v1/document/sends:
    post:
      operationId: post__api_v1_document_sends
      summary: POST /api/v1/document/sends
      x-generated-from: routes/documents.routes.js:6
      x-feature-owner: atharvvishwakarma255-stack
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
        "400":
          description: At least one recipient is required
        "404":
          description: Business package not found
        "409":
          description: Business package usage limit reached
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                business_package_id:
                  type: string
                status:
                  type: string
                signature_type:
                  type: string
                is_notarization_required:
                  type: boolean
                expires_at:
                  type: string
                placeholder_values:
                  type: array
                recipients:
                  type: array
              required:
                - business_package_id
                - expires_at
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
