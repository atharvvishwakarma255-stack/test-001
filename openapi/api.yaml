          description: OK
        "400":
          description: At least one recipient is required
        "404":
          description: Business package not found
        "409":
          description: Business package usage limit reached
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                business_package_id:
                  type: string
                status:
                  type: string
                signature_type:
                  type: string
                is_notarization_required:
                  type: boolean
                expires_at:
                  type: string
                placeholder_values:
                  type: array
                recipients:
