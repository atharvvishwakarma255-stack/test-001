          description: email and password are required
        "401":
          description: Invalid email or password
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
                - email
                - password
  /api/v1/document/sends:
    post:
      operationId: post__api_v1_document_sends
      summary: POST /api/v1/document/sends
      x-generated-from: routes/documents.routes.js:6
