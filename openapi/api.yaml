              example:
                users:
                  - user1
                  - user2
                  - user3
      x-generated-from: routes/misc.routes.js:7
  /users/{id}:
    get:
      operationId: getUser
      summary: Get a user by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              example:
                id: "1"
                name: Aniket
        "404":
          description: Not found
  /api/v1/auth/register:
    post:
      operationId: post__api_v1_auth_register
      summary: POST /api/v1/auth/register
      x-generated-from: routes/auth.routes.js:5
      x-feature-owner: atharvvishwakarma255-stack
      responses:
        "200":
          description: OK
        "400":
          description: password must be at least 8 characters
        "409":
          description: An account with this email already exists
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string
              required:
                - name
